# Build the static export into an nginx image and publish it to Artifact
# Registry. The Maps key is a public browser key baked into the bundle at
# build time and restricted by HTTP referrer on the key itself.
substitutions:
  _REGION: asia-south1
  _IMAGE: how-siliguri-moves
  _MAPS_KEY: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_MAPS_API_KEY=${_MAPS_KEY}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_IMAGE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_IMAGE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_IMAGE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
