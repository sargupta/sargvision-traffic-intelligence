# Build config for the API and intelligence loop.
#
# Explicit rather than `gcloud builds submit --tag`, for two reasons: the build
# is versioned with the code, and CLOUD_LOGGING_ONLY means the deploy identity
# does not need project Viewer just to read its own build logs. Without it
# gcloud exits non-zero on a build that actually succeeded, because it cannot
# stream from the default bucket.
substitutions:
  _REGION: asia-south1
  _IMAGE: traffic-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_IMAGE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_IMAGE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_IMAGE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
