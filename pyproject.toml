[project]
name = "sargvision-traffic-intelligence"
version = "0.1.0"
description = "AI-powered traffic intelligence and investigation copilot for Siliguri"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "polars>=1.17",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=3.0.5",
]

[project.optional-dependencies]
ai = ["google-genai>=0.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
# Selected deliberately rather than accepting every default. The set is
# "things that are bugs or that hide bugs", not house style.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes — unused names, undefined names
    "I",           # import order
    "B",           # bugbear — B023 caught a real late-binding closure bug
    "C4",          # comprehension clarity
    "SIM",         # simplifications that reduce branching
    "UP",          # modern syntax for the Python we target
    "RUF",
]
ignore = [
    # FastAPI's dependency-injection idiom IS a call in a default argument.
    # Flagging Query(), Body() and Depends() would mean annotating every route.
    "B008",
    # Naive datetimes are deliberate: the container runs on Asia/Kolkata and
    # every timestamp is Siliguri wall-clock, which is what an officer reads.
    # Made explicit in apps/api/main.py; see the timezone commit.
    "DTZ",
    # Line length is enforced by the formatter, not the linter.
    "E501",
    # The multiplication sign is deliberate in prose about scoring formulas
    # ("severity × persistence × confidence"); an ASCII x reads as a variable.
    "RUF001", "RUF002", "RUF003",
    # str+Enum is intentional: these values are serialised to JSON and compared
    # against strings across the API boundary.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests may repeat themselves and construct fixtures inline for readability.
"tests/*" = ["C408", "RUF015", "B023", "SIM117"]
# The multiplication sign is deliberate in prose about scoring formulas
# ("severity × persistence × confidence"), and an ASCII x reads as a variable.
extend-safe-fixes = ["RUF"]
